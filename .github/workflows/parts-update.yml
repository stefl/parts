# Record every story's parts sidecar on CI's Chromium, so the recorded
# `violations` and `unclassified` ceilings match what the stories measure
# there, not on a laptop. Record mode only ever lowers a count, so a run can
# tighten the ratchet but never loosen it; a new story is recorded only at
# zero.
#
# Manual only. It does not push: the sidecars come back as an artifact, and
# whoever dispatched it commits them on a branch, so the PR that carries them
# runs the normal checks.
#
#   gh workflow run parts-update.yml --ref <branch>
#   gh run download <run-id> -n parts-sidecars -D <scratch dir>
#   tar -xf <scratch dir>/parts-sidecars.tar     (from the repo root)
name: parts-update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_GLOBAL_STORE: "0"
      - id: playwright
        run: echo "version=$(grep -oE '"playwright@[0-9][^"]*"' bun.lock | head -1 | tr -d '"' | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-v1
      - run: bunx playwright install chromium
        working-directory: apps/example
      # Record mode fails a story that measures above zero and has no entry,
      # so the step may go red while the sidecars it did write are still
      # worth having; the upload runs either way.
      - run: bun run parts:update
        working-directory: apps/example
        continue-on-error: true
      - name: List sidecars
        run: |
          git status --porcelain -- 'apps/example/src/*.stories.parts.json'
          git ls-files -o --exclude-standard -- 'apps/example/src/*.stories.parts.json'
      - run: |
          { git ls-files -z -- 'apps/example/src/*.stories.parts.json'; git ls-files -z -o --exclude-standard -- 'apps/example/src/*.stories.parts.json'; } | xargs -0 tar -cf parts-sidecars.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: parts-sidecars
          path: parts-sidecars.tar
          if-no-files-found: error
          retention-days: 7
